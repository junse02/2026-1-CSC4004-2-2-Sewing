spring:
  datasource:
    url: jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres
    username: postgres.btuopynrwnqkktxsqjys          # 기본 계정명
    password: ${DB_PASSWORD}                         # 환경변수 처리
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # update: 엔티티(User 클래스 등)를 보고 테이블을 자동으로 만들어줌
      ddl-auto: update
    show-sql: true        # 실행되는 SQL을 콘솔에 출력
    properties:
      hibernate:
        format_sql: true  # SQL을 보기 좋게 출력
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}                     # 환경변수 처리

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8000}       # AI 서버 URL (기본값: 로컬)

jwt:
  secret: ${JWT_SECRET}                              # 환경변수 처리
  expiration: 3600000 # 1시간 (밀리초 단위)
